services:
  postgres:
    image: postgres:17-alpine
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexora-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nexora:nexora@postgres:5432/nexora_os?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-for-production}
      WEB_ORIGIN: http://localhost:3000
      AI_MODE: local
      ML_NLP_URL: http://ml-nlp:8010
      UPLOAD_DIR: /app/storage/uploads
      STORAGE_MODE: local
      MAX_UPLOAD_MB: 25
      AUDIT_LOG_MODE: database
      OPS_ADMIN_EMAIL: admin@nexora.local
      NEXORA_DATA_MODE: database
      DATA_EXPORT_MODE: database-json
      DATA_SYNC_STRATEGY: prisma
      NEXORA_BOOTSTRAP_ADMIN_EMAIL: ${NEXORA_BOOTSTRAP_ADMIN_EMAIL}
      NEXORA_BOOTSTRAP_ADMIN_PASSWORD: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD}
      NEXORA_BOOTSTRAP_ADMIN_NAME: ${NEXORA_BOOTSTRAP_ADMIN_NAME:-Nexora Administrator}
      NEXORA_DEMO_LOGIN_ENABLED: ${NEXORA_DEMO_LOGIN_ENABLED:-true}
      CODE_RUN_TIMEOUT_MS: ${CODE_RUN_TIMEOUT_MS:-4000}
      CODE_RUN_DOCKER_PULL_POLICY: ${CODE_RUN_DOCKER_PULL_POLICY:-never}
      CODE_RUN_PYTHON_IMAGE: ${CODE_RUN_PYTHON_IMAGE:-python:3.12-alpine}
      CODE_RUN_NODE_IMAGE: ${CODE_RUN_NODE_IMAGE:-node:22-alpine}
      CODE_RUN_MEMORY_LIMIT: ${CODE_RUN_MEMORY_LIMIT:-256m}
      CODE_RUN_CPU_LIMIT: ${CODE_RUN_CPU_LIMIT:-0.5}
      CODE_RUN_PIDS_LIMIT: ${CODE_RUN_PIDS_LIMIT:-128}
      PORT: 8311
    ports:
      - "8311:8311"
    volumes:
      - upload-data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

  ml-nlp:
    build:
      context: .
      dockerfile: services/ml-nlp/Dockerfile
    container_name: nexora-ml-nlp
    restart: unless-stopped
    ports:
      - "8010:8010"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexora-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8311/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  upload-data:
