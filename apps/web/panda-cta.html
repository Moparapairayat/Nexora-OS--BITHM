<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelFlow Panda - AI Enhanced Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ==================================================
           UI & ENVIRONMENT STYLES
           ================================================== */
        :root {
            --bg-color: #0b0d14;
            --card-bg: rgba(22, 25, 37, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f2f8;
            --text-muted: #8b92a5;
            --accent: #4ade80;
            --accent-hover: #22c55e;
            --ai-accent: #a5b4fc;
            --ai-accent-hover: #818cf8;
            
            /* Mascot Layout Variables */
            --panda-size: 500px;
            --panda-top: -100px;
            --panda-right: -280px;

            /* Spotlight Layer Variables (Easily adjustable) */
            --spotlight-color: rgba(255, 228, 180, 0.08); /* 8% warm light intensity */
            --spotlight-fade: rgba(255, 228, 180, 0.02);  /* 2% mid-fade intensity */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(74, 222, 128, 0.03), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.04), transparent 30%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .contact-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            z-index: 1;
        }

        /* Ambient Spotlight Layer */
        .ambient-spotlight {
            position: absolute;
            top: -250px; /* Positions the center of the light outside the viewport */
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            height: 800px;
            background: radial-gradient(ellipse at 50% 0%, var(--spotlight-color) 0%, var(--spotlight-fade) 40%, transparent 70%);
            filter: blur(6px); /* Heavy cinematic blur */
            pointer-events: none; /* Crucial: clicks pass through to the form and mascot */
            mix-blend-mode: screen; /* Naturally brightens the dark scene without washing out whites */
            z-index: 50; /* Sits above the card and panda to gently illuminate them */
        }

        /* The Premium Contact Card */
        .contact-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 50px 48px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.5), 
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 0 40px rgba(255, 255, 255, 0.02);
            z-index: 2;
        }

        .contact-header { margin-bottom: 36px; }
        .contact-header h2 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .contact-header p {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 300;
            line-height: 1.5;
        }

        .form-group { margin-bottom: 24px; position: relative; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-control:focus {
            outline: none;
            border-color: rgba(74, 222, 128, 0.5);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.08);
        }
        textarea.form-control { resize: none; height: 120px; }

        /* AI Toolbar Styles */
        .ai-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .ai-btn {
            background: rgba(165, 180, 252, 0.1);
            border: 1px solid rgba(165, 180, 252, 0.2);
            color: var(--ai-accent);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-btn:hover:not(:disabled) {
            background: rgba(165, 180, 252, 0.2);
            border-color: rgba(165, 180, 252, 0.4);
            color: var(--text-main);
        }

        .ai-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ai-status {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
            transition: opacity 0.3s ease;
            opacity: 0;
        }
        .ai-status.visible { opacity: 1; }
        .ai-status.error { color: #f87171; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #10b981);
            color: #022c22;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(74, 222, 128, 0.2);
            margin-top: 8px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(74, 222, 128, 0.3);
            filter: brightness(1.05);
        }

        /* ==================================================
           MASCOT STRUCTURAL & ANIMATION PREP STYLES
           ================================================== */
        .mascot-container {
            position: absolute;
            top: var(--panda-top);
            right: var(--panda-right);
            width: var(--panda-size);
            height: var(--panda-size);
            z-index: 10;
            /* Container cannot receive clicks, but children can */
            pointer-events: none; 
        }

        .mascot-svg {
            width: 100%;
            height: 100%;
            display: block;
            /* Allow falling character to render outside bounding box */
            overflow: visible; 
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.4));
        }

        /* We restore pointer-events to the actual character for hit detection */
        #panda-character { pointer-events: auto; }
        .interactive-zone { cursor: pointer; }

        #panda-head { transform-origin: 300px 230px; }
        #panda-body { transform-origin: 300px 240px; }
        #arm-hanging { transform-origin: 360px 110px; }
        #arm-free { transform-origin: 260px 280px; }
        #leg-left { transform-origin: 290px 360px; }
        #leg-right { transform-origin: 360px 360px; }
        #bamboo-branch { transform-origin: 480px 20px; }
        #panda-character { transform-origin: 360px 110px; isolation: isolate; }

        /* Idle & Interaction Behavior Transforms */
        #panda-fall-wrapper { transform-origin: 300px 300px; will-change: transform; }
        #panda-head-idle { transform-origin: 300px 230px; will-change: transform; }
        #panda-body-idle { transform-origin: 300px 240px; will-change: transform; }
        #arm-free-idle { transform-origin: 260px 280px; will-change: transform; }
        #arm-hanging-idle { transform-origin: 360px 110px; will-change: transform; }
        #bamboo-branch-idle { transform-origin: 480px 20px; will-change: transform; }
        #eye-left-inner { transform-origin: 254px 212px; will-change: transform; }
        #eye-right-inner { transform-origin: 334px 199px; will-change: transform; }
        
        #pupil-left-idle, #pupil-right-idle, #spiral-eyes, #eye-left-group, #eye-right-group { 
            will-change: transform; 
            transition: opacity 0.2s ease;
        }
        #mouth-line, #mouth-yawn, #mouth-smile, #mouth-annoyed { 
            transition: opacity 0.2s ease; 
        }

        #pupil-left, #pupil-right { will-change: transform; }
        #panda-head, #panda-body { will-change: transform; }
        #bamboo-branch { will-change: transform; }
        
        .spiral-path { transform-origin: center; }
    </style>
</head>

    <!-- Gemini API Script (Unchanged) -->
    <script>
        const apiKey = "";
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        async function fetchWithRetry(url, options, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function rewriteMessage(tone) {
            const textarea = document.getElementById('message-input');
            const originalText = textarea.value.trim();
            const statusEl = document.getElementById('ai-status');
            const btnProf = document.getElementById('btn-prof');
            const btnFriend = document.getElementById('btn-friend');

            if (!originalText) {
                setStatus("Please write a message first.", true);
                return;
            }

            setStatus(`Generating ${tone} draft...`, false);
            btnProf.disabled = true;
            btnFriend.disabled = true;

            const prompt = `Rewrite the following message to sound ${tone}. It is a message in a website contact form. Only return the rewritten message, do not include any conversational filler, intro, or quotes. \n\nMessage: "${originalText}"`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            try {
                const data = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (generatedText) {
                    textarea.value = generatedText.trim();
                    setStatus("Updated successfully!");
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                setStatus("Failed to connect to AI.", true);
            } finally {
                btnProf.disabled = false;
                btnFriend.disabled = false;
                setTimeout(() => {
                    if (statusEl.textContent === "Updated successfully!" || statusEl.classList.contains('error')) {
                        statusEl.classList.remove('visible');
                    }
                }, 3000);
            }
        }

        function setStatus(message, isError = false) {
            const statusEl = document.getElementById('ai-status');
            statusEl.textContent = message;
            statusEl.classList.add('visible');
            if (isError) statusEl.classList.add('error');
            else statusEl.classList.remove('error');
        }
    </script>

    <!-- ==================================================
         PANDA CURSOR-TRACKING ANIMATION 
         ================================================== -->
    <script>
    (function pandaCursorTracking() {
        'use strict';

        const MAX_PUPIL_OFFSET_X = 6, MAX_PUPIL_OFFSET_Y = 8;
        const MAX_HEAD_ROTATION = 15, MAX_BODY_LEAN = 5;      
        const SENSITIVITY_RADIUS = 650;
        const EASE_EYES = 0.35, EASE_HEAD = 0.10, EASE_BODY = 0.045;
        const HEAD_ORIGIN_VB = { x: 300, y: 230 }, VIEWBOX_SIZE = 500;

        const mascotContainer = document.getElementById('mascot-container');
        const pupilLeft = document.getElementById('pupil-left');
        const pupilRight = document.getElementById('pupil-right');
        const headGroup = document.getElementById('panda-head');
        const bodyGroup = document.getElementById('panda-body');

        if (!mascotContainer || !pupilLeft || !pupilRight || !headGroup || !bodyGroup) return;

        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let headOriginScreen = { x: 0, y: 0 };
        let currentPupilX = 0, currentPupilY = 0, currentHeadRot = 0, currentBodyRot = 0;

        window.pandaAttentionTarget = null; 

        function updateHeadOrigin() {
            const rect = mascotContainer.getBoundingClientRect();
            const scaleX = rect.width / VIEWBOX_SIZE;
            const scaleY = rect.height / VIEWBOX_SIZE;
            headOriginScreen.x = rect.left + HEAD_ORIGIN_VB.x * scaleX;
            headOriginScreen.y = rect.top + HEAD_ORIGIN_VB.y * scaleY;
        }

        window.addEventListener('pointermove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        }, { passive: true });
        window.addEventListener('resize', updateHeadOrigin, { passive: true });
        updateHeadOrigin();

        function tick() {
            const targetX = window.pandaAttentionTarget ? window.pandaAttentionTarget.x : mouseX;
            const targetY = window.pandaAttentionTarget ? window.pandaAttentionTarget.y : mouseY;
            
            const dx = targetX - headOriginScreen.x;
            const dy = targetY - headOriginScreen.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            const proximity = Math.min(distance / SENSITIVITY_RADIUS, 1);

            const targetPupilX = Math.cos(angle) * MAX_PUPIL_OFFSET_X * proximity;
            const targetPupilY = Math.sin(angle) * MAX_PUPIL_OFFSET_Y * proximity;
            const normX = Math.max(-1, Math.min(1, dx / (window.innerWidth / 2)));
            const targetHeadRot = normX * MAX_HEAD_ROTATION;
            const targetBodyRot = normX * MAX_BODY_LEAN;

            currentPupilX += (targetPupilX - currentPupilX) * EASE_EYES;
            currentPupilY += (targetPupilY - currentPupilY) * EASE_EYES;
            currentHeadRot += (targetHeadRot - currentHeadRot) * EASE_HEAD;
            currentBodyRot += (targetBodyRot - currentBodyRot) * EASE_BODY;

            const pupilTransform = `translate(${currentPupilX.toFixed(2)}px, ${currentPupilY.toFixed(2)}px)`;
            pupilLeft.style.transform = pupilTransform;
            pupilRight.style.transform = pupilTransform;
            headGroup.style.transform = `rotate(${currentHeadRot.toFixed(2)}deg)`;
            bodyGroup.style.transform = `rotate(${currentBodyRot.toFixed(2)}deg)`;

            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    })();
    </script>

    <!-- ==================================================
         BAMBOO SPRING PHYSICS & HANGING SWING
         ================================================== -->
    <script>
    (function bambooSwingPhysics() {
        'use strict';
        const BRANCH_STIFFNESS = 0.018, BRANCH_DAMPING = 0.22, BRANCH_MAX_BEND = 5;        
        const PANDA_STIFFNESS = 0.010, PANDA_DAMPING = 0.16, PANDA_SWING_FACTOR = 1.3;   
        const IDLE_SWAY_AMPLITUDE = 0.5, IDLE_SWAY_SPEED = 0.00035;  
        const CURSOR_INFLUENCE_RADIUS = 700, BRANCH_ORIGIN_VB = { x: 480, y: 20 }, VIEWBOX_SIZE = 500;

        const mascotContainer = document.getElementById('mascot-container');
        const branchGroup = document.getElementById('bamboo-branch');
        const pandaCharacter = document.getElementById('panda-character');

        if (!mascotContainer || !branchGroup || !pandaCharacter) return;

        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let branchOriginScreen = { x: 0, y: 0 }, branchAngle = 0, branchVelocity = 0;
        let pandaSwingAngle = 0, pandaVelocity = 0;

        function updateBranchOrigin() {
            const rect = mascotContainer.getBoundingClientRect();
            const scaleX = rect.width / VIEWBOX_SIZE;
            const scaleY = rect.height / VIEWBOX_SIZE;
            branchOriginScreen.x = rect.left + BRANCH_ORIGIN_VB.x * scaleX;
            branchOriginScreen.y = rect.top + BRANCH_ORIGIN_VB.y * scaleY;
        }

        window.addEventListener('pointermove', e => { mouseX = e.clientX; mouseY = e.clientY; }, { passive: true });
        window.addEventListener('resize', updateBranchOrigin, { passive: true });
        updateBranchOrigin();

        function stepSpring(angle, velocity, target, stiffness, damping) {
            const acceleration = -stiffness * (angle - target) - damping * velocity;
            return [angle + velocity + acceleration, velocity + acceleration];
        }

        function tick(timestamp) {
            const dx = mouseX - branchOriginScreen.x, dy = mouseY - branchOriginScreen.y;
            const proximity = Math.min(Math.sqrt(dx * dx + dy * dy) / CURSOR_INFLUENCE_RADIUS, 1);
            const pull = Math.max(-1, Math.min(1, dx / CURSOR_INFLUENCE_RADIUS)) * proximity;
            const idleOffset = Math.sin(timestamp * IDLE_SWAY_SPEED) * IDLE_SWAY_AMPLITUDE;
            
            [branchAngle, branchVelocity] = stepSpring(branchAngle, branchVelocity, pull * BRANCH_MAX_BEND + idleOffset, BRANCH_STIFFNESS, BRANCH_DAMPING);
            [pandaSwingAngle, pandaVelocity] = stepSpring(pandaSwingAngle, pandaVelocity, branchAngle * PANDA_SWING_FACTOR, PANDA_STIFFNESS, PANDA_DAMPING);

            branchGroup.style.transform = `rotate(${branchAngle.toFixed(3)}deg)`;
            pandaCharacter.style.transform = `rotate(${pandaSwingAngle.toFixed(3)}deg)`;
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    })();
    </script>

        let state = 'AWAKE'; 
        let lastMouseTime = performance.now();

        let clickTimer = null;

        const stateVals = {

            armRot: 0,

        let activeTweens = [], activeDelays = [], particleEntities = [];

        // ----------------------------------------------------
        // TWEENING & UTILS
        // ----------------------------------------------------
        const easeInCubic = t => t * t * t;
        const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
        const easeOutElastic = t => {
            const c4 = (2 * Math.PI) / 3;
            return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
        };

        function animateProp(prop, endValue, duration, easing = easeInOutCubic) {
            return new Promise(resolve => {
                activeTweens.push({
                    prop, startValue: stateVals[prop], endValue, duration, easing, startTime: performance.now(), resolve
                });
            });
        }

        function sleepDelay(ms) {
            return new Promise(resolve => {
                const timerId = setTimeout(() => {
                    activeDelays = activeDelays.filter(d => d.timerId !== timerId);
                    resolve();
                }, ms);
                activeDelays.push({ timerId, resolve });
            });
        }

        function cancelAllAnimations() {
            activeTweens.forEach(t => t.resolve());
            activeTweens = [];
            activeDelays.forEach(d => { clearTimeout(d.timerId); d.resolve(); });
            activeDelays = [];
        }

        function setMouth(type) {
            dom.mouthLine.style.opacity = type === 'line' ? '1' : '0';

            text.textContent = "z";
            text.setAttribute("fill", "#dce1ee");
            text.setAttribute("font-family", "Outfit, sans-serif");
            text.setAttribute("font-weight", "600");
            text.setAttribute("font-size", "22px");
            dom.zzzLayer.appendChild(text);
            particleEntities.push({ type: 'zzz', el: text, startTime: performance.now() });
        }

        function spawnStar(angleOffset) {
            const star = document.createElementNS("http://www.w3.org/2000/svg", "path");
            star.setAttribute("d", "M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z");
            star.setAttribute("fill", "#fbbf24");
            dom.starsLayer.appendChild(star);
            particleEntities.push({ type: 'star', el: star, startTime: performance.now(), angleOffset });
        }

        function spawnLeaf() {
            const leaf = document.createElementNS("http://www.w3.org/2000/svg", "path");
            leaf.setAttribute("d", "M 0 0 Q -10 -5 -15 5 Q 0 15 0 0");
            leaf.setAttribute("fill", "#4ade80");
            dom.leavesLayer.appendChild(leaf);
            particleEntities.push({ type: 'leaf', el: leaf, startTime: performance.now() });
        }
        
        function spawnDust(x, y) {
            const puff = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            puff.setAttribute("r", 10 + Math.random() * 12);
            puff.setAttribute("fill", "#cbd5e1");
            dom.dustLayer.appendChild(puff);
            particleEntities.push({ 
                type: 'dust', 
                el: puff, 
                startTime: performance.now(),
                x, y,
                vx: (Math.random() - 0.5) * 0.15,
                vy: -Math.random() * 0.08
            });
        }

        // ----------------------------------------------------
        // EVENT LISTENERS
        // ----------------------------------------------------
        
        let mouseX = 0, mouseY = 0, lastX = 0, lastY = 0, lastT = performance.now(), fastFrames = 0;
        
        window.addEventListener('pointermove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            lastMouseTime = performance.now();
            if (state === 'ASLEEP' || state === 'FALLING_ASLEEP' || state === 'LOOKING_AROUND' || state === 'YAWNING') {
                cancelAllAnimations();
                wakeUpSequence();
            }
        }, { passive: true });

        document.getElementById('panda-character').addEventListener('dblclick', playWaveSequence);

        document.getElementById('panda-character').addEventListener('click', (e) => {
            clickCount++; clearTimeout(clickTimer);
            clickTimer = setTimeout(() => clickCount = 0, 1000);
            
            if (clickCount >= 5 && state !== 'ANNOYED' && state !== 'CELEBRATING') {
                playAnnoyedSequence(); return;
            }
            if (state !== 'AWAKE') return;
            if (e.target.id === 'hit-nose') playSneezeSequence();
            else if (e.target.id === 'hit-belly') playGiggleSequence();
        });

        document.querySelectorAll('.form-control').forEach(el => {
            el.addEventListener('focus', handleInputFocus);
            el.addEventListener('blur', handleInputBlur);
            el.addEventListener('input', handleInputType);
        });

        document.getElementById('submit-btn').addEventListener('mouseenter', hoverSendBtn);
        document.getElementById('submit-btn').addEventListener('mouseleave', unhoverSendBtn);
        
        // FORM SUBMISSION HOOK
        document.getElementById('submit-btn').addEventListener('click', (e) => {
            const name = document.getElementById('input-name').value.trim();
            const email = document.getElementById('input-email').value.trim();
            const msg = document.getElementById('message-input').value.trim();
            
            if (name && email && msg) {
                const btn = e.target;
                btn.textContent = "Sent successfully!";
                btn.style.background = "#10b981";
                btn.disabled = true;
                
                // Trigger the massive celebration fall animation
                playSubmitSequence();
                
                // Reset form eventually
                setTimeout(() => {
                    btn.textContent = "Send Message";
                    btn.style.background = "";
                    btn.disabled = false;
                    document.getElementById('input-name').value = '';
                    document.getElementById('input-email').value = '';
                    document.getElementById('message-input').value = '';
                }, 6500); 
            } else {
                setStatus("Please fill out all fields.", true);
                setTimeout(() => setStatus("Ready"), 3000);
            }
        });


        // ----------------------------------------------------
        // MAIN ANIMATION LOOP
        // ----------------------------------------------------
        let lastZzzTime = 0, starSpin = 0;
        
        function tick(timestamp) {
            // Idle Check
            if (state === 'AWAKE' && (timestamp - lastMouseTime > 5000)) playIdleSequence();

            // Dizzy Check
            const dt = timestamp - lastT;
            if (dt > 0) {
                const vel = Math.hypot(mouseX - lastX, mouseY - lastY) / dt;
                if (vel > 3.0) fastFrames++; else fastFrames = 0;
                if (fastFrames > 5 && state === 'AWAKE') playDizzySequence();
            }
            lastX = mouseX; lastY = mouseY; lastT = timestamp;

            // Process Tweens
            for (let i = activeTweens.length - 1; i >= 0; i--) {
                const t = activeTweens[i];
                const progress = Math.min((timestamp - t.startTime) / t.duration, 1);
                if (progress >= 1) {
                    stateVals[t.prop] = t.endValue;
                    t.resolve();
                    activeTweens.splice(i, 1);
                } else {
                    stateVals[t.prop] = t.startValue + (t.endValue - t.startValue) * t.easing(progress);
                }
            }

            // Procedural Breathing & Dizzy Modifiers
            if (state === 'ASLEEP' || state === 'FALLING_ASLEEP') {
                const cycle = timestamp * 0.002;
                breath.scaleY = Math.sin(cycle) * 0.015;
                breath.scaleX = Math.cos(cycle) * 0.005; 
                breath.headRot = Math.sin(cycle) * 1.5;
                breath.bambooRot = Math.sin(cycle - 0.5) * 0.4;
            } else {
                breath.scaleY *= 0.9; breath.scaleX *= 0.9;
                breath.headRot *= 0.9; breath.bambooRot *= 0.9;
            }

            if (state === 'DIZZY') {
                const cycle = timestamp * 0.015;
                stateVals.headRot = Math.sin(cycle) * 6;
                starSpin = timestamp * 0.15;
                dom.spiralL.style.transform = `rotate(${timestamp * 0.5}deg)`;
                dom.spiralR.style.transform = `rotate(${timestamp * 0.5}deg)`;
            }

            // Apply All Transforms
            // Apply fall wrapper logic first (decoupled translation & rotation)
            dom.fallWrapper.style.transform = `translate(${stateVals.fallX}px, ${stateVals.fallY}px) rotate(${stateVals.fallRot}deg)`;
            
            dom.head.style.transform = `rotate(${stateVals.headRot + breath.headRot}deg)`;
            dom.body.style.transform = `scale(${stateVals.bodyScaleX + breath.scaleX}, ${stateVals.bodyScaleY + breath.scaleY})`;
            dom.arm.style.transform = `rotate(${stateVals.armRot}deg)`;
            dom.armHanging.style.transform = `rotate(${stateVals.armHangingRot}deg)`;
            document.getElementById('leg-right').style.transform = `rotate(${stateVals.legRightRot}deg)`;
            dom.bamboo.style.transform = `rotate(${breath.bambooRot + stateVals.bambooProceduralBending}deg)`;
            
            const eyeScale = `scaleY(${stateVals.eyeScaleY})`;
            dom.eyeLeftInner.style.transform = eyeScale;
            dom.eyeRightInner.style.transform = eyeScale;
            
            const pupilTrans = `translateX(${stateVals.pupilX}px)`;
            dom.pupilLeft.style.transform = pupilTrans;
            dom.pupilRight.style.transform = pupilTrans;

            // Particle Updates
            if (state === 'ASLEEP' && (timestamp - lastZzzTime > 2500)) { spawnZzz(); lastZzzTime = timestamp; }

            for (let i = particleEntities.length - 1; i >= 0; i--) {
                const p = particleEntities[i];
                const age = timestamp - p.startTime;

                if (p.type === 'zzz') {
                    const life = age / 4000;
                    if (life >= 1) { p.el.remove(); particleEntities.splice(i, 1); }
                    else {
                        const driftY = -life * 75, driftX = Math.sin(life * Math.PI * 3) * 12 + life * 15;
                        let opacity = life < 0.2 ? life / 0.2 : life > 0.6 ? 1 - ((life - 0.6) / 0.4) : 1;
                        p.el.setAttribute('transform', `translate(${290 + driftX}, ${240 + driftY}) scale(${0.5 + life})`);
                        p.el.setAttribute('opacity', opacity);
                    }
                } 
                else if (p.type === 'star') {
                    if (state !== 'DIZZY') { p.el.remove(); particleEntities.splice(i, 1); }
                    else {
                        const angle = p.angleOffset + (starSpin * Math.PI / 180);
                        p.el.setAttribute('transform', `translate(${300 + Math.cos(angle)*60}, ${200 + Math.sin(angle)*24}) rotate(${starSpin*2}) scale(1.5)`);
                    }
                }
                else if (p.type === 'leaf') {
                    const life = age / 2000;
                    if (life >= 1) { p.el.remove(); particleEntities.splice(i, 1); }
                    else {
                        const x = 350 - (life * 40) + Math.sin(life * 10) * 15;
                        p.el.setAttribute('transform', `translate(${x}, ${140 + (life * 150)}) rotate(${life * 180})`);
                        p.el.setAttribute('opacity', 1 - (life * life));
                    }
                }
                else if (p.type === 'dust') {
                    const life = age / 800;
                    if (life >= 1) { p.el.remove(); particleEntities.splice(i, 1); }
                    else {
                        p.el.setAttribute('transform', `translate(${p.x + p.vx * age}, ${p.y + p.vy * age}) scale(${1 + life})`);
                        p.el.setAttribute('opacity', 0.8 * (1 - life));
                    }
                }
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    })();
    </script>
</body>
</html>
